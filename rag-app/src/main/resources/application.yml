app:
  table-name: document_chunks_claude_llm
  input-token-limit: ${CLAUDE_MODEL_INPUT_TOKEN_LIMIT}
  similarity-threshold: ${THRESHOLD}
  top-chunk: ${TOP_CHUNK}
  chunk-size: ${CHUNK_SIZE}

  llm:
    prompt:
      source: db
    active-model: ${CLAUDE_MODEL}

springdoc:
  api-docs:
    enabled: ${SWAGGER_API_DOCS}
  swagger-ui:
    enabled: ${SWAGGER_UI}

spring:
  application:
    name: rag-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${API_KEY}

      chat:
        options:
          model: ${CLAUDE_MODEL}
    ollama:
      base-url: http://ollama:11434
      embedding:
        options:
          model: ${EMBEDDING_MODEL}
